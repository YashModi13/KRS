spring.application.name=backend

# Database Switch Flag (true = Local PostgreSQL, false = Neon Cloud PostgreSQL)
islocaldbconnect=${IS_LOCAL_DB_CONNECT:false}

# --- Local PostgreSQL Settings (used when islocaldbconnect=true) ---
db.local.url=${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/krs_db?currentSchema=krs_schema}
db.local.username=${LOCAL_DB_USERNAME:krd_postgress}
db.local.password=${LOCAL_DB_PASSWORD:Krs@Prod!Db#2026}

# --- Neon Cloud DB Settings (used when islocaldbconnect=false) ---
db.neon.url=${NEON_DB_URL:jdbc:postgresql://ep-young-rain-b3ynvfjr-pooler.c-4.ap-southeast-1.aws.neon.tech:5432/krs_db?currentSchema=krs_schema&sslmode=require}
db.neon.username=${NEON_DB_USERNAME:neondb_owner}
db.neon.password=${NEON_DB_PASSWORD:npg_Su0eYVn8JxAG}

spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool & Auto-Reconnect Settings ---
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=-1

spring.jpa.hibernate.ddl-auto=none
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect (auto-detected by Hibernate)
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=${DB_SCHEMA:krs_schema}
spring.liquibase.liquibase-schema=${DB_SCHEMA:krs_schema}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:krs_schema}


# --- Logging & CORS ---
app.cors.origins=${CORS_ORIGINS:*}
logging.level.liquibase=INFO
logging.level.liquibase.integration.spring.SpringLiquibase=INFO
spring.liquibase.parameters.liquibase.show-summary=SUMMARY

