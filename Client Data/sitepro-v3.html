    function App() {
      const [db, setDb] = useState(null);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [view, setView] = useState("dashboard");
      const [activePid, setActivePid] = useState(null);
      const [tab, setTab] = useState("overview");
      const [notifOpen, setNotifOpen] = useState(false);
      const [modal, setModal] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        (async () => {
          try { const r = await window.storage.get(DB_KEY); setDb(r ? JSON.parse(r.value) : defaultDB); }
          catch { setDb(defaultDB); }
          setLoading(false);
        })();
      }, []);

      const save = useCallback(async (nd) => {
        setSaving(true);
        try { await window.storage.set(DB_KEY, JSON.stringify(nd)); showToast("Saved ✓"); }
        catch { showToast("Save failed", true); }
        setSaving(false);
      }, []);

      const update = useCallback((fn) => {
        setDb(prev => { const next = fn(structuredClone(prev)); save(next); return next; });
      }, [save]);

      const showToast = (msg, err=false) => { setToast({msg,err}); setTimeout(()=>setToast(null),2200); };

      if (loading) return (
        <div style={{background:"#050b14",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Space Grotesk',sans-serif",color:"#60a5fa",fontSize:20}}>
          <div style={{textAlign:"center"}}>
            <div style={{fontSize:48,marginBottom:14,filter:"drop-shadow(0 0 20px rgba(37,99,235,0.5))"}}>🏛</div>
            <div>Loading SitePro PWD…</div>
            <div style={{fontSize:13,color:"#4a6fa5",marginTop:6}}>Gujarat PWD · SSA Management</div>
          </div>
        </div>
      );

      const proj = db.projects.find(p => p.id === activePid);

      const alerts = [];
      db.projects.forEach(p => {
        const eff = p.extendedEndDate || p.tenderEndDate;
        const dl = daysLeft(eff);
        if (dl !== null && dl <= 45 && dl >= 0) alerts.push({type:"timelimit", msg:`Time limit in ${dl} days`, project:p.name, pid:p.id, days:dl});
        if (dl !== null && dl < 0) alerts.push({type:"overdue", msg:`OVERDUE by ${Math.abs(dl)} days`, project:p.name, pid:p.id, days:dl});
        if (!p.retentionReleased && p.rmReminderDate) {
          const rd = daysLeft(p.rmReminderDate);
          if (rd !== null && rd <= 60) alerts.push({type:"rm", msg:`RM Release due in ${rd}d`, project:p.name, pid:p.id, days:rd});
        }
        if (!p.sdReleased && p.sdReminderDate) {
          const sd = daysLeft(p.sdReminderDate);
          if (sd !== null && sd <= 60) alerts.push({type:"sd", msg:`SD Release due in ${sd}d`, project:p.name, pid:p.id, days:sd});
        }
        p.villages.forEach(v => {
          const veff = v.extEndDate || v.endDate;
          const vd = daysLeft(veff);
          if (vd !== null && vd <= 45 && vd >= 0) alerts.push({type:"village", msg:`${v.name}: ${vd}d to deadline`, project:p.name, pid:p.id, days:vd});
        });
      });

      const pSet = (pid,field,val) => update(d=>{d.projects.find(p=>p.id===pid)[field]=val;return d;});
      const addProject = (data) => { update(d=>{d.projects.push({...data,id:uid(),status:"active",villages:[],raBills:[],timeLimitExtensions:[],letters:[],milestones:[],weeklyProgress:[],documents:[],notes:"",negotiationLetterDoc:"",workOrderDoc:"",sdDoc:"",sdReleased:false,retentionReleased:false,extraWorkDoc:"",excessAmount:0,excessApprovalRef:"",sdReminderDate:"",sdReminderNote:"",rmReminderDate:"",rmReminderNote:""});return d;}); setModal(null); showToast("Project created"); };
      const delProject = (pid) => { update(d=>{d.projects=d.projects.filter(p=>p.id!==pid);return d;}); setView("projects"); setActivePid(null); };
      const addVillage = (pid,data) => update(d=>{d.projects.find(p=>p.id===pid).villages.push({...data,id:uid(),status:"active"});return d;});
      const updateVillage = (pid,vid,field,val) => update(d=>{const v=d.projects.find(p=>p.id===pid).villages.find(v=>v.id===vid);v[field]=val;return d;});
      const delVillage = (pid,vid) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.villages=p.villages.filter(v=>v.id!==vid);return d;});
      const addRaBill = (pid,data) => update(d=>{d.projects.find(p=>p.id===pid).raBills.push({...data,id:uid(),deptBillDoc:""});return d;});
      const updRaBill = (pid,bid,field,val) => update(d=>{const b=d.projects.find(p=>p.id===pid).raBills.find(b=>b.id===bid);b[field]=val;return d;});
      const delRaBill = (pid,bid) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.raBills=p.raBills.filter(b=>b.id!==bid);return d;});
      const addTLE = (pid,data) => update(d=>{d.projects.find(p=>p.id===pid).timeLimitExtensions.push({...data,id:uid()});return d;});
      const delTLE = (pid,id) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.timeLimitExtensions=p.timeLimitExtensions.filter(t=>t.id!==id);return d;});
      const addLetter = (pid,data) => update(d=>{d.projects.find(p=>p.id===pid).letters.push({...data,id:uid(),doc:""});return d;});
      const delLetter = (pid,id) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.letters=p.letters.filter(l=>l.id!==id);return d;});
      const addMilestone = (pid,data) => update(d=>{d.projects.find(p=>p.id===pid).milestones.push({...data,id:uid(),done:false});return d;});
      const togMilestone = (pid,mid) => update(d=>{const m=d.projects.find(p=>p.id===pid).milestones.find(m=>m.id===mid);m.done=!m.done;return d;});
      const delMilestone = (pid,mid) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.milestones=p.milestones.filter(m=>m.id!==mid);return d;});
      const addWeek = (pid) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.weeklyProgress.push({week:`W${p.weeklyProgress.length+1}`,earthwork:0,masonry:0,concrete:0,steel:0,finishing:0});return d;});
      const updWeek = (pid,i,f,v) => update(d=>{d.projects.find(p=>p.id===pid).weeklyProgress[i][f]=Math.min(100,Math.max(0,parseInt(v)||0));return d;});
      const addDoc = (pid,data) => update(d=>{d.projects.find(p=>p.id===pid).documents.push({...data,id:uid(),date:new Date().toISOString().slice(0,10)});return d;});
      const delDoc = (pid,did) => update(d=>{const p=d.projects.find(p=>p.id===pid);p.documents=p.documents.filter(x=>x.id!==did);return d;});
      const addTodo = (data) => update(d=>{d.todos.push({...data,id:uid(),done:false,doneDate:"",remark:""});return d;});
      const updTodo = (id,field,val) => update(d=>{const t=d.todos.find(t=>t.id===id);t[field]=val;if(field==="done"&&val)t.doneDate=new Date().toISOString().slice(0,10);return d;});
      const delTodo = (id) => update(d=>{d.todos=d.todos.filter(t=>t.id!==id);return d;});
      const addTeam = (data) => update(d=>{d.teamMembers.push({...data,id:uid()});return d;});
      const updTeam = (id,field,val) => update(d=>{const m=d.teamMembers.find(m=>m.id===id);if(m)m[field]=val;return d;});
      const delTeam = (id) => update(d=>{d.teamMembers=d.teamMembers.filter(m=>m.id!==id);return d;});

      const openProject = (pid,t="overview") => { setActivePid(pid); setTab(t); setView("project"); };

        {key:"approvals",icon:"🔖",label:"Approvals"},
        {key:"finance",icon:"₹",label:"Finance"},
        {key:"team",icon:"👷",label:"Team"},
        {key:"settings",icon:"⚙",label:"Settings"},

              <div style={{fontFamily:"'Space Grotesk',sans-serif",fontSize:18,fontWeight:800,background:"linear-gradient(90deg,#60a5fa,#3b82f6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",letterSpacing:-.5}}>🏛 SitePro</div>
              <div style={{fontSize:10,color:"#2a4a7f",marginTop:1,letterSpacing:.04}}>Gujarat PWD · SSA</div>
            </div>
            {navItems.map(({key,icon,label}) => (

                {tab==="overview"  &&<OverviewTab   proj={proj} fmt={fmt} fmtDate={fmtDate} daysLeft={daysLeft} pSet={pSet}/>}
                {tab==="villages"  &&<VillagesTab   proj={proj} addVillage={addVillage} updateVillage={updateVillage} delVillage={delVillage} fmtDate={fmtDate} daysLeft={daysLeft} setModal={setModal}/>}
                {tab==="timelimit" &&<TimeLimitTab  proj={proj} addTLE={addTLE} delTLE={delTLE} pSet={pSet} fmtDate={fmtDate} daysLeft={daysLeft} setModal={setModal}/>}
                {tab==="rabills"   &&<RaBillsTab    proj={proj} addRaBill={addRaBill} updRaBill={updRaBill} delRaBill={delRaBill} fmt={fmt} fmtDate={fmtDate} setModal={setModal}/>}

                {tab==="milestones"&&<MilestonesTab proj={proj} togMilestone={togMilestone} addMilestone={addMilestone} delMilestone={delMilestone} fmtDate={fmtDate} daysLeft={daysLeft} setModal={setModal}/>}
                {tab==="worksite"  &&<WorksiteTab   proj={proj} addWeek={addWeek} updWeek={updWeek}/>}
                {tab==="documents" &&<DocumentsTab  proj={proj} addDoc={addDoc} delDoc={delDoc} fmtDate={fmtDate} setModal={setModal}/>}

          {notifOpen&&<>

              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:700,fontSize:15}}>Alerts</div>
                <button className="nm-btn nm-btn-sm" onClick={()=>setNotifOpen(false)}>✕</button>
              </div>
              {alerts.length===0&&<div style={{color:"#4a6fa5",textAlign:"center",marginTop:40,fontSize:13}}>All clear 🎉</div>}
              {alerts.map((a,i)=>{
                const bg={timelimit:"rgba(60,30,0,0.6)",overdue:"rgba(80,0,0,0.6)",rm:"rgba(40,10,80,0.6)",sd:"rgba(20,40,10,0.5)",village:"rgba(10,30,70,0.6)"}[a.type]||"rgba(10,20,45,0.7)";
                const bc={timelimit:"rgba(180,90,0,0.3)",overdue:"rgba(200,0,0,0.3)",rm:"rgba(120,50,220,0.3)",sd:"rgba(80,180,50,0.3)",village:"rgba(37,99,235,0.3)"}[a.type]||"rgba(37,99,235,0.2)";
                return(
                  <div key={i} onClick={()=>{a.pid&&openProject(a.pid);setNotifOpen(false);}} style={{background:bg,border:`1px solid ${bc}`,borderRadius:12,padding:"11px 14px",marginBottom:8,cursor:a.pid?"pointer":"default",backdropFilter:"blur(8px)"}}>
                    <div style={{fontSize:12,fontWeight:600,marginBottom:2}}>{a.msg}</div>
                    <div style={{fontSize:11,color:"#4a6fa5"}}>{a.project}</div>
                    <div style={{fontSize:11,color:a.days<7?"#f87171":a.days<15?"#fb923c":"#f59e0b",marginTop:3,fontWeight:600}}>{a.days>=0?`${a.days} days remaining`:`Overdue by ${Math.abs(a.days)}d`}</div>

                );

          </>}

          {modal&&<ModalRouter modal={modal} setModal={setModal} db={db} addProject={addProject} delProject={delProject} addVillage={addVillage} addTLE={addTLE} addRaBill={addRaBill} addLetter={addLetter} addMilestone={addMilestone} addDoc={addDoc} addTodo={addTodo} addTeam={addTeam} save={save} showToast={showToast}/>}
        </div>
      );

            {[["📁","Projects",db.projects.length,"#3b82f6"],["💼","Contract Value",fmt(tb),"#34d399"],["🔒","Retention Held",fmt(rm),"#a78bfa"],["🏦","Security Deposits",fmt(sd),"#f59e0b"]].map(([icon,label,val,col])=>(

    function ProjectsListView({db,fmt,fmtDate,daysLeft,onOpen}) {
      const [search,setSearch]=useState("");
      const [sort,setSort]=useState("name");
      const [filterStatus,setFilterStatus]=useState("all");
      const filtered = useMemo(()=>{
        let list=[...db.projects];
        if(search) list=list.filter(p=>p.name.toLowerCase().includes(search.toLowerCase())||p.workOrderNo.toLowerCase().includes(search.toLowerCase())||p.contractorName.toLowerCase().includes(search.toLowerCase()));
        if(filterStatus!=="all") list=list.filter(p=>p.status===filterStatus);
        list.sort((a,b)=>{
          if(sort==="name") return a.name.localeCompare(b.name);
          if(sort==="deadline"){ const da=daysLeft(a.extendedEndDate||a.tenderEndDate)||9999,db2=daysLeft(b.extendedEndDate||b.tenderEndDate)||9999; return da-db2; }
          if(sort==="value") return (b.contractAmount||0)-(a.contractAmount||0);
          if(sort==="progress"){ const pa=a.milestones.filter(m=>m.done).length/Math.max(a.milestones.length,1),pb2=b.milestones.filter(m=>m.done).length/Math.max(b.milestones.length,1); return pb2-pa; }
          return 0;
        });
        return list;
      },[db.projects,search,sort,filterStatus]);
      return (
        <div>
          <div className="filter-bar">
            <div className="search-bar" style={{flex:1,minWidth:200}}>
              <span style={{color:"#4a6fa5",fontSize:14}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search by name, WO no, contractor…"/>
              {search&&<span onClick={()=>setSearch("")} style={{color:"#4a6fa5",cursor:"pointer"}}>✕</span>}
            </div>
            <select className="nm-input" style={{width:"auto",padding:"7px 12px",fontSize:12}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}>
              <option value="all">All Status</option><option value="active">Active</option><option value="nearing">Nearing</option><option value="completed">Completed</option><option value="delayed">Delayed</option>
            </select>
            <select className="nm-input" style={{width:"auto",padding:"7px 12px",fontSize:12}} value={sort} onChange={e=>setSort(e.target.value)}>
              <option value="name">Sort: Name</option><option value="deadline">Sort: Deadline</option><option value="value">Sort: Value ↓</option><option value="progress">Sort: Progress ↓</option>
            </select>
          </div>
          <div style={{fontSize:12,color:"#4a6fa5",marginBottom:12}}>{filtered.length} of {db.projects.length} projects</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(330px,1fr))",gap:14}}>
            {filtered.map(p=>{
              const eff=p.extendedEndDate||p.tenderEndDate;
              const dl=daysLeft(eff);
              const pct=Math.round(p.milestones.filter(m=>m.done).length/Math.max(p.milestones.length,1)*100);
              const rm=p.raBills.reduce((s,b)=>s+(b.retentionAmt||0),0);
              const col=dl<0?"#ef4444":dl<=15?"#f97316":dl<=45?"#f59e0b":"#22c55e";
              return (
                <div key={p.id} className="nm hov glow-active" onClick={()=>onOpen(p.id)} style={{cursor:"pointer"}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
                    <div>
                      <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{p.name}</div>
                      <div style={{fontSize:11,color:"#4a6fa5"}}>WO: {p.workOrderNo}</div>
                    </div>
                    <span className="pill" style={{background:sColor(p.status)+"22",color:sColor(p.status),border:`1px solid ${sColor(p.status)}44`,alignSelf:"flex-start"}}>{p.status}</span>
                  </div>
                  <div style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",fontSize:11,color:"#4a6fa5",marginBottom:5}}><span>Progress</span><span style={{color:"#c8deff",fontWeight:600}}>{pct}%</span></div>
                    <div className="pb"><div className="pf" style={{width:`${pct}%`,background:`linear-gradient(90deg,#1d4ed8,#3b82f6)`}}/></div>
                  </div>
                  <div className="g3" style={{marginBottom:10}}>

        if(search) list=list.filter(m=>m.title.toLowerCase().includes(search.toLowerCase()));
        if(sort==="due") list.sort((a,b)=>new Date(a.due)-new Date(b.due));
        if(sort==="status") list.sort((a,b)=>Number(a.done)-Number(b.done));
        if(sort==="az") list.sort((a,b)=>a.title.localeCompare(b.title));
        return list;
      },[proj.milestones,search,sort]);
      return(
        <div className="nm">
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontWeight:600,fontSize:13,color:"#60a5fa"}}>Milestones ({proj.milestones.filter(m=>m.done).length}/{proj.milestones.length})</div>
            <button className="nm-btn nm-btn-accent nm-btn-sm" onClick={()=>setModal({type:"addMilestone",projectId:proj.id})}>+ Add</button>
          </div>
          <div className="filter-bar">
            <div className="search-bar" style={{flex:1}}>
              <span style={{color:"#4a6fa5"}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search milestones…"/>
              {search&&<span onClick={()=>setSearch("")} style={{color:"#4a6fa5",cursor:"pointer"}}>✕</span>}
            </div>
            <select className="nm-input" style={{width:"auto",padding:"7px 12px",fontSize:12}} value={sort} onChange={e=>setSort(e.target.value)}>
              <option value="due">Sort: Due Date</option><option value="status">Sort: Pending First</option><option value="az">Sort: A–Z</option>
            </select>
          </div>
          {filtered.map((m,i)=>(
            <div key={m.id} style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:14}}>
              <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                <div className={`chk ${m.done?"done":""}`} onClick={()=>togMilestone(proj.id,m.id)}>{m.done&&<span style={{color:"#fff",fontSize:11}}>✓</span>}</div>
                {i<filtered.length-1&&<div style={{width:2,height:22,background:m.done?"rgba(37,99,235,0.4)":"rgba(30,80,160,0.15)",marginTop:3}}/>}
              </div>
              <div style={{flex:1,paddingTop:1}}>
                <div style={{fontWeight:600,fontSize:13,color:m.done?"#4a6fa5":"#c8deff",textDecoration:m.done?"line-through":"none"}}>{m.title}</div>
                <div style={{fontSize:11,color:"#4a6fa5",marginTop:2}}>Due: {fmtDate(m.due)} · {daysLeft(m.due)!==null?(daysLeft(m.due)>=0?`${daysLeft(m.due)}d left`:"Past due"):"—"}</div>
              </div>
              <span className="pill" style={{background:m.done?"rgba(20,83,45,0.3)":"rgba(20,30,60,0.5)",color:m.done?"#4ade80":"#4a6fa5"}}>{m.done?"Done":"Pending"}</span>
              <button className="nm-btn nm-btn-xs nm-btn-danger" onClick={()=>delMilestone(proj.id,m.id)}>✕</button>
            </div>
          ))}
          {filtered.length===0&&<div style={{color:"#4a6fa5",textAlign:"center",padding:30,fontSize:13}}>No milestones</div>}
        </div>
      );
    }

    function WorksiteTab({proj,addWeek,updWeek}) {
      const fields=[["earthwork","#f59e0b"],["masonry","#3b82f6"],["concrete","#22c55e"],["steel","#a78bfa"],["finishing","#f97316"]];
      return(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:12}}>
            {proj.weeklyProgress.map((w,i)=>(
              <div key={i} className="nm">
                <div style={{fontWeight:600,marginBottom:12,fontSize:13,color:"#60a5fa"}}>{w.week}</div>
                {fields.map(([f,c])=>(
                  <div key={f} style={{marginBottom:10}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4,fontSize:11}}>
                      <span style={{color:"#94a3b8",textTransform:"capitalize"}}>{f}</span>
                      <span style={{color:c,fontWeight:700}}>{w[f]}%</span>
                    </div>
                    <input type="range" min={0} max={100} value={w[f]} onChange={e=>updWeek(proj.id,i,f,e.target.value)} style={{accentColor:c}}/>
                  </div>
                ))}
                <div style={{fontSize:11,color:"#4a6fa5",marginTop:4}}>Avg: {Math.round(fields.reduce((s,[f])=>s+w[f],0)/fields.length)}%</div>
              </div>
            ))}
          </div>
          <button className="nm-btn" style={{marginTop:12}} onClick={()=>addWeek(proj.id)}>+ Add Week</button>
        </div>
      );
    }

    function DocumentsTab({proj,addDoc,delDoc,fmtDate,setModal}) {
      const [search,setSearch]=useState("");
      const [sort,setSort]=useState("date");
      const [filterType,setFilterType]=useState("all");
      const typeColors={Drawing:"#3b82f6",WorkOrder:"#22c55e",SD:"#f59e0b",Legal:"#8b5cf6",Finance:"#f97316",Other:"#64748b"};
      const filtered=useMemo(()=>{
        let list=[...proj.documents];
        if(search) list=list.filter(d=>d.name.toLowerCase().includes(search.toLowerCase()));
        if(filterType!=="all") list=list.filter(d=>d.type===filterType);
        if(sort==="date") list.sort((a,b)=>new Date(b.date)-new Date(a.date));
        if(sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
        if(sort==="type") list.sort((a,b)=>a.type.localeCompare(b.type));
        return list;
      },[proj.documents,search,sort,filterType]);
      return(
        <div className="nm">
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
            <div style={{fontWeight:600,fontSize:13,color:"#60a5fa"}}>Documents ({proj.documents.length})</div>
            <button className="nm-btn nm-btn-accent nm-btn-sm" onClick={()=>setModal({type:"addDoc",projectId:proj.id})}>+ Add</button>
          </div>
          <div className="filter-bar">
            <div className="search-bar" style={{flex:1}}>
              <span style={{color:"#4a6fa5"}}>🔍</span>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search documents…"/>
              {search&&<span onClick={()=>setSearch("")} style={{color:"#4a6fa5",cursor:"pointer"}}>✕</span>}
            </div>
            <select className="nm-input" style={{width:"auto",padding:"7px 12px",fontSize:12}} value={filterType} onChange={e=>setFilterType(e.target.value)}>
              <option value="all">All Types</option><option value="Drawing">Drawing</option><option value="WorkOrder">Work Order</option><option value="SD">SD</option><option value="Legal">Legal</option><option value="Finance">Finance</option><option value="Other">Other</option>
            </select>
            <select className="nm-input" style={{width:"auto",padding:"7px 12px",fontSize:12}} value={sort} onChange={e=>setSort(e.target.value)}>
              <option value="date">Date ↓</option><option value="name">Name</option><option value="type">Type</option>
            </select>
          </div>
          {filtered.map(d=>(
            <div key={d.id} style={{display:"flex",gap:12,alignItems:"center",padding:"10px 12px",background:"rgba(5,12,28,0.55)",borderRadius:11,marginBottom:8,border:"1px solid rgba(30,80,160,0.1)"}}>
              <div style={{width:34,height:34,borderRadius:8,background:(typeColors[d.type]||"#64748b")+"20",border:`1px solid ${(typeColors[d.type]||"#64748b")}30`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,flexShrink:0}}>📄</div>
              <div style={{flex:1}}><div style={{fontWeight:600,fontSize:12}}>{d.name}</div><div style={{fontSize:11,color:"#4a6fa5",marginTop:2}}>{fmtDate(d.date)}{d.note?` · ${d.note}`:""}</div></div>
              <span className="pill" style={{background:(typeColors[d.type]||"#64748b")+"20",color:(typeColors[d.type]||"#64748b")}}>{d.type}</span>
              <button className="nm-btn nm-btn-xs nm-btn-danger" onClick={()=>delDoc(proj.id,d.id)}>✕</button>
            </div>
          ))}
          {filtered.length===0&&<div style={{color:"#4a6fa5",textAlign:"center",padding:30,fontSize:13}}>No documents match</div>}
        </div>
      );
    }

    function NotesTab({proj,pSet}) {
      const [local,setLocal]=useState(proj.notes||"");
      useEffect(()=>setLocal(proj.notes||""),[proj.id]);
      return(
        <div className="nm">
          <div style={{fontWeight:600,marginBottom:12,fontSize:13,color:"#60a5fa"}}>Project Notes</div>
          <textarea className="nm-input" rows={12} value={local} onChange={e=>setLocal(e.target.value)} placeholder="DLP terms, site remarks, special conditions…"/>
          <button className="nm-btn nm-btn-accent" style={{marginTop:10}} onClick={()=>pSet(proj.id,"notes",local)}>Save Notes</button>
        </div>
      );
    }

    function ModalRouter({modal,setModal,db,addProject,delProject,addVillage,addTLE,addRaBill,addLetter,addMilestone,addDoc,addTodo,addTeam,save,showToast}) {
      const close=()=>setModal(null);
      if(modal.type==="addProject") return <NmFormModal title="New Ongoing Project" fields={[
        {key:"name",label:"Project Name / Package",type:"text",required:true},
        {key:"workOrderNo",label:"Work Order Number",type:"text"},
        {key:"negotiationLetterNo",label:"Negotiation Letter No.",type:"text"},
        {key:"contractorName",label:"Contractor Name",type:"text"},
        {key:"tenderAmount",label:"Tender Amount (₹)",type:"number"},
        {key:"contractAmount",label:"Contract Amount (₹)",type:"number"},
        {key:"securityDeposit",label:"Security Deposit (₹)",type:"number"},
        {key:"sdType",label:"SD Type",type:"select",options:["FDR","BankGuarantee","Cash"]},
        {key:"retentionPct",label:"Retention %",type:"number",default:5},
        {key:"tenderStartDate",label:"Start Date",type:"date"},
        {key:"tenderEndDate",label:"Tender End Date",type:"date"},
      ]} onSubmit={d=>addProject({...d,tenderAmount:parseFloat(d.tenderAmount)||0,contractAmount:parseFloat(d.contractAmount)||0,securityDeposit:parseFloat(d.securityDeposit)||0,retentionPct:parseFloat(d.retentionPct)||5})} onClose={close} submitLabel="Create Project"/>;

      if(modal.type==="addVillage") return <NmFormModal title="Add Village / Site" fields={[
        {key:"name",label:"Village Name",type:"text",required:true},
        {key:"startDate",label:"Start Date",type:"date",required:true},
        {key:"endDate",label:"End Date (Original)",type:"date",required:true},
        {key:"extEndDate",label:"Extended End Date (if any)",type:"date"},
        {key:"note",label:"Note",type:"text"},
      ]} onSubmit={d=>addVillage(modal.projectId,d)} onClose={close} submitLabel="Add Village"/>;

      if(modal.type==="addTLE") return <NmFormModal title="Add Time Limit Extension" fields={[
        {key:"upto",label:"Extended Upto (Date)",type:"date",required:true},
        {key:"reason",label:"Reason for Extension",type:"text",required:true},
        {key:"approvalRef",label:"Approval / Manjuri Ref No.",type:"text"},
        {key:"approvedOn",label:"Approved On",type:"date"},
      ]} onSubmit={d=>addTLE(modal.projectId,d)} onClose={close} submitLabel="Add Extension"/>;

      if(modal.type==="addRaBill") return <NmFormModal title="Add RA Bill" fields={[
        {key:"label",label:"Bill Label (e.g. RA Bill 3)",type:"text",required:true},
        {key:"billDate",label:"Bill Date",type:"date"},
        {key:"amount",label:"Bill Amount (₹)",type:"number",required:true},
        {key:"retentionAmt",label:"Retention Deducted (₹)",type:"number"},
        {key:"checkPersonName",label:"Bill Check Person (Name & Designation)",type:"text"},
        {key:"invoiceDate",label:"Invoice Submitted Date",type:"date"},
        {key:"depositDate",label:"Deposit Date",type:"date"},
        {key:"status",label:"Status",type:"select",options:["pending","submitted","approved","paid"]},
      ]} onSubmit={d=>addRaBill(modal.projectId,{...d,amount:parseFloat(d.amount)||0,retentionAmt:parseFloat(d.retentionAmt)||0,invoiceSubmitted:!!d.invoiceDate,deptBillCopy:false,deposited:!!d.depositDate})} onClose={close} submitLabel="Add RA Bill"/>;

      if(modal.type==="addLetter") return <NmFormModal title="Add Letter" fields={[
        {key:"type",label:"Letter Type",type:"select",options:["KRS","Department","Contractor","Other"]},
        {key:"subject",label:"Subject",type:"text",required:true},
        {key:"authorName",label:"Author / From",type:"text"},
        {key:"date",label:"Letter Date",type:"date"},
      ]} onSubmit={d=>addLetter(modal.projectId,d)} onClose={close} submitLabel="Add Letter"/>;

      if(modal.type==="addMilestone") return <NmFormModal title="Add Milestone" fields={[
        {key:"title",label:"Milestone Title",type:"text",required:true},
        {key:"due",label:"Due Date",type:"date",required:true},
      ]} onSubmit={d=>addMilestone(modal.projectId,d)} onClose={close} submitLabel="Add"/>;

      if(modal.type==="addDoc") return <NmFormModal title="Add Document" fields={[
        {key:"name",label:"Document Name",type:"text",required:true},
        {key:"type",label:"Type",type:"select",options:["WorkOrder","Drawing","SD","Legal","Finance","Other"]},
        {key:"note",label:"Note",type:"text"},
      ]} onSubmit={d=>addDoc(modal.projectId,d)} onClose={close} submitLabel="Add Document"/>;

      if(modal.type==="addTodo") return <NmFormModal title="Add Daily Task" fields={[
        {key:"task",label:"Task Description",type:"text",required:true},
        {key:"doneBy",label:"Assigned To",type:"select",options:db.teamMembers.map(m=>m.name),required:true},
        {key:"projectId",label:"Project",type:"select",options:["", ...db.projects.map(p=>p.id)],optionLabels:["General",...db.projects.map(p=>p.name)]},
      ]} onSubmit={d=>addTodo(d)} onClose={close} submitLabel="Add Task"/>;

      if(modal.type==="addTeam") return <NmFormModal title="Add Team Member" fields={[
        {key:"name",label:"Full Name",type:"text",required:true},
        {key:"role",label:"Role / Designation",type:"text"},
        {key:"phone",label:"Phone Number",type:"text"},
        {key:"email",label:"Email",type:"text"},
      ]} onSubmit={d=>addTeam(d)} onClose={close} submitLabel="Add Member"/>;

      if(modal.type==="confirmDelete") return(
        <div className="modal-bg"><div className="modal-box">
          <div style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:800,fontSize:17,marginBottom:10,color:"#f87171"}}>Delete Project?</div>
          <div style={{fontSize:13,color:"#4a6fa5",marginBottom:18,lineHeight:1.6}}>All data including villages, RA bills, letters, and documents will be permanently deleted.</div>
          <div style={{display:"flex",gap:10}}>
            <button className="nm-btn nm-btn-danger" style={{flex:1}} onClick={()=>delProject(modal.pid)}>Delete</button>
            <button className="nm-btn" onClick={close}>Cancel</button>
          </div>
        </div></div>
      );

      if(modal.type==="resetDB") return(
        <div className="modal-bg"><div className="modal-box">
          <div style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:800,fontSize:17,marginBottom:10,color:"#f87171"}}>Reset Database?</div>
          <div style={{fontSize:13,color:"#4a6fa5",marginBottom:18}}>All data will be wiped and replaced with sample data.</div>
          <div style={{display:"flex",gap:10}}>
            <button className="nm-btn nm-btn-danger" style={{flex:1}} onClick={async()=>{try{await save(defaultDB);showToast("Database reset");close();window.location.reload();}catch{showToast("Reset failed",true);}}}>Reset</button>
            <button className="nm-btn" onClick={close}>Cancel</button>
          </div>
        </div></div>
      );
      return null;
    }

    function NmFormModal({title,fields,onSubmit,onClose,submitLabel}) {
      const [form,setForm]=useState(()=>{const i={};fields.forEach(f=>{i[f.key]=f.default!==undefined?String(f.default):(f.type==="select"?(f.options?.[0]||""):"");});return i;});
      const handle=()=>{for(const f of fields){if(f.required&&!form[f.key]){alert(`${f.label} is required`);return;}}onSubmit(form);onClose();};
      return(
        <div className="modal-bg"><div className="modal-box">
          <div style={{fontFamily:"'Space Grotesk',sans-serif",fontWeight:800,fontSize:17,marginBottom:18,background:"linear-gradient(90deg,#60a5fa,#3b82f6)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>{title}</div>
          <div style={{display:"grid",gap:10}}>
            {fields.map(f=>(
              <div key={f.key}>
                <div style={{fontSize:12,color:"#4a6fa5",marginBottom:5}}>{f.label}{f.required&&<span style={{color:"#f87171"}}> *</span>}</div>
                {f.type==="select"?(
                  <select className="nm-input" style={{fontSize:12}} value={form[f.key]} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))}>
                    {(f.options||[]).map((o,i)=><option key={o} value={o}>{f.optionLabels?.[i]||o}</option>)}
                  </select>
                ):(
                  <input type={f.type||"text"} className="nm-input" style={{fontSize:12}} value={form[f.key]} onChange={e=>setForm(p=>({...p,[f.key]:e.target.value}))}/>
                )}
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:10,marginTop:20}}>
            <button className="nm-btn nm-btn-accent" style={{flex:1}} onClick={handle}>{submitLabel}</button>
            <button className="nm-btn" onClick={onClose}>Cancel</button>
          </div>
        </div></div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
