<div class="login-wrapper">
  <div class="brand-panel">
    <div class="brand-content">
      <div class="logo-wrapper">
        <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#ffffff" />
          <path d="M6 24V14l10-8 10 8v10H20v-7h-8v7H6z" fill="#1e3a8a" />
        </svg>
        <h1>KRS Construction</h1>
      </div>
      <p class="tagline">Enterprise Project Management & PWD Tracking Platform</p>
      <div class="decorative-shapes">
         <div class="shape circle"></div>
         <div class="shape square"></div>
         <div class="shape dots"></div>
      </div>
    </div>
    <div class="footer-text">
      &copy; 2026 Gujarat PWD. All rights reserved.
    </div>
  </div>
  <div class="form-panel">
    <div class="form-container">
      <div class="form-header">
        <div class="header-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <h2>Sign In</h2>
        <p>Please enter your credentials to access the system</p>
      </div>
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label>Username</label>
          <div class="input-wrapper">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input #usernameInput type="text" [(ngModel)]="username" (input)="onInput()" (change)="onInput()" (blur)="onInput()" name="username" placeholder="Enter your username" required>
          </div>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <span class="icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input #passwordInput [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" (input)="onInput()" (change)="onInput()" (blur)="onInput()" name="password" placeholder="Enter your password" required>
            <button type="button" class="show-password-btn" (click)="togglePassword()">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        
        <div class="form-actions">
          <label class="remember-me">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="spinner"></span>
          <svg *ngIf="!isLoading" class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>

        <div class="message-container">
          <div *ngIf="loginError" class="alert-box error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
            {{ loginError }}
          </div>
          <div *ngIf="loginSuccess" class="alert-box success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            Login successful! Redirecting...
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
